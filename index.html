<div id="page1"></div>
<div id="page2"></div>
<div id="page3"></div>
<div id="page4"></div>

<script>
function loadInto(id, file) {
  fetch(file)
    .then(r => r.text())
    .then(html => document.getElementById(id).innerHTML = html);
}

loadInto("page1", "traffic-lights.html");
loadInto("page2", "Forecast.html");
loadInto("page3", "wind-stations.html");
loadInto("page4", "Live-Wind-Map.html");
</script>
