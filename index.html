<div id="page1"></div>

<script type="module">
import { initTrafficLights } from "./traffic-lights.js";

function loadInto(id, file) {
  return fetch(file)
    .then(r => r.text())
    .then(html => {
      document.getElementById(id).innerHTML = html;
    });
}

loadInto("page1", "traffic-lights.html").then(() => {
  initTrafficLights("#page1");
});
</script>
