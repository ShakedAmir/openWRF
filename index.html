<!--
  דיימונד — לוח מאוחד (רמזור · תחזית · תחנות · רוח חיה)
  מותאם מובייל. מקורות: WRF-1km + IMS דרך ה-Apps Script.
  להטמעה: Google Sites → Insert → Embed → "Embed code".
  (אם ההטמעה ארוכה מדי ל-Sites — ארח את הקובץ ב-GitHub Pages והטמע By URL.)
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<div id="dmd" dir="rtl">
  <section class="dmd-block pad"><div id="go" dir="rtl">
  <div class="go-spot">🪁 גלישת קייט · דיימונד כנרת</div>
  <div class="go-light" id="go-light">
    <div class="go-lamp" id="go-lamp"></div>
    <div class="go-label" id="go-label">בודק תנאים…</div>
    <div class="go-sub" id="go-sub"></div>
  </div>

  <div class="go-checks" id="go-checks"></div>

  <div class="go-foot">
    <button id="go-refresh" class="go-refresh">רענן</button>
    <span class="go-time" id="go-time"></span>
  </div>
</div></section>
  <section class="dmd-block pad"><div id="fc" dir="rtl">
  <div class="fc-head">
    <div class="fc-title">תחזית רוח <span id="fc-date"></span></div>
    <button id="fc-refresh" class="fc-refresh">רענן</button>
  </div>
  <div class="fc-grid" id="fc-grid"></div>
  <div class="fc-foot" id="fc-foot">טוען…</div>
</div></section>
  <section class="dmd-block"><div id="wrf">
  <div class="wrf-head">
    <div class="wrf-title">openWRF <span class="wrf-sep">/</span> wind stations</div>
    <div class="wrf-count" id="wrf-count"></div>
  </div>
  <div id="wrf-detail" class="wrf-detail" style="display: none;">
    <button id="wrf-close" class="wrf-close" aria-label="Close">×</button>
    <div class="wrf-d-name" id="wrf-d-name"></div>
    <div class="wrf-d-sub" id="wrf-d-sub"></div>
    <div class="wrf-d-chart"><canvas id="wrf-canvas"></canvas></div>
    <div id="wrf-d-table-wrap"></div>
    <div class="wrf-d-msg" id="wrf-d-msg"></div>
  </div>
  <div class="wrf-body">
    <aside class="wrf-side">
      <input id="wrf-search" class="wrf-search" type="search" placeholder="Search station" autocomplete="off">
      <button id="wrf-map-toggle" class="wrf-map-toggle">🗺️ הצג מפה</button>
      <div id="wrf-list" class="wrf-list" role="listbox" aria-label="Stations"></div>
      <div class="wrf-legend">
        <span><i class="dot ok"></i>located</span>
        <span><i class="dot chk"></i>verify</span>
      </div>
    </aside>
    <div class="wrf-mapwrap">
      <div id="wrf-map"></div>
    </div>
  </div>
</div></section>
  <section class="dmd-block"><div id="wind">
  <div class="w-head">
    <div class="w-title">רוח חיה <span class="w-sep">·</span> IMS</div>
    <div class="w-legend" id="w-legend"></div>
    <button id="w-refresh" class="w-refresh">רענן</button>
  </div>
  <div id="w-map"></div>
  <div class="w-foot" id="w-foot">טוען…</div>
</div></section>
</div>

<style>
  /* ===== מעטפת: ארבעה רכיבים אחד מתחת לשני ===== */
  #dmd{ font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",sans-serif;
    max-width:900px;margin:0 auto; }
  #dmd *{ box-sizing:border-box; }
  #dmd .dmd-block{ margin-bottom:18px; }
  #dmd .dmd-block:last-child{ margin-bottom:0; }
  #dmd .dmd-block.pad{ padding:0; }
  @media (max-width:640px){
    #dmd .dmd-block{ margin-bottom:14px; }
  }

  /* ===== רמזור ===== */
  #go{
    --bg:#ffffff;--ink:#0f2436;--muted:#5b7186;--line:#e3e9ef;
    --green:#1f9d55;--green-soft:#e6f6ec;--red:#d13b3b;--red-soft:#fbe9e9;
    --amber:#e08a1e;--amber-soft:#fbeeda;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",sans-serif;
    color:var(--ink);background:var(--bg);max-width:440px;margin:0 auto;
    border:1px solid var(--line);border-radius:16px;overflow:hidden;
  }
  #go *{box-sizing:border-box}
  #go .go-spot{ text-align:center; font-size:15px; font-weight:700; color:var(--muted);
    padding:12px 16px 0; }
  #go .go-light{padding:22px 20px 18px;text-align:center;transition:background .3s}
  #go .go-lamp{width:74px;height:74px;border-radius:50%;margin:0 auto 12px;
    background:#cbd5e1;box-shadow:0 0 0 6px rgba(0,0,0,.04);transition:all .3s}
  #go .go-label{font-size:26px;font-weight:800;letter-spacing:-.02em}
  #go .go-sub{font-size:13px;color:var(--muted);margin-top:4px;min-height:16px}

  #go.is-go .go-light{background:var(--green-soft)}
  #go.is-go .go-lamp{background:var(--green);box-shadow:0 0 0 6px rgba(31,157,85,.18),0 6px 18px rgba(31,157,85,.35)}
  #go.is-go .go-label{color:var(--green)}
  #go.is-no .go-light{background:var(--red-soft)}
  #go.is-no .go-lamp{background:var(--red);box-shadow:0 0 0 6px rgba(209,59,59,.16),0 6px 18px rgba(209,59,59,.3)}
  #go.is-no .go-label{color:var(--red)}
  #go.is-wait .go-light{background:var(--chk-soft)}
  #go.is-wait .go-lamp{background:var(--amber);box-shadow:0 0 0 6px rgba(224,138,30,.16)}
  #go.is-wait .go-label{color:var(--amber)}

  #go .go-checks{border-top:1px solid var(--line)}
  #go .go-check{display:flex;align-items:flex-start;gap:10px;padding:11px 18px;
    border-bottom:1px solid var(--line);font-size:14px}
  #go .go-check:last-child{border-bottom:none}
  #go .go-ic{flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:13px;font-weight:800;color:#fff;margin-top:1px}
  #go .go-ic.pass{background:var(--green)}
  #go .go-ic.fail{background:var(--red)}
  #go .go-ic.warn{background:var(--amber)}
  #go .go-ic.unk{background:#9aa8b6}
  #go .go-ctext{flex:1;min-width:0}
  #go .go-ctitle{font-weight:600}
  #go .go-cval{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:1px}

  #go .go-foot{display:flex;align-items:center;justify-content:space-between;
    padding:10px 18px;background:#f7f9fb;border-top:1px solid var(--line)}
  #go .go-refresh{border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
  #go .go-refresh:hover{background:#f1f5f9}
  #go .go-time{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ===== כרטיס תחזית ===== */
  #fc{
    --line:#e3e9ef;--ink:#0f2436;--muted:#5b7186;--panel:#fff;--accent:#2b74b8;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",sans-serif;
    color:var(--ink);background:var(--panel);border:2px solid #7b96b8;border-radius:14px;
    overflow:hidden;max-width:760px;margin:0 auto;
  }
  #fc *{box-sizing:border-box}
  #fc .fc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 16px;background:#66bd6a;color:#fff}
  #fc .fc-title{font-size:19px;font-weight:800}
  #fc .fc-refresh{border:none;background:rgba(255,255,255,.25);color:#fff;border-radius:8px;
    padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  #fc .fc-refresh:hover{background:rgba(255,255,255,.4)}

  /* שורה אחת לכל ספוט */
  #fc .fc-grid{display:block}
  #fc .fc-col{padding:12px 16px;border-bottom:1px solid var(--line)}
  #fc .fc-col:last-child{border-bottom:none}
  #fc .fc-row{display:flex;align-items:center;gap:12px}
  #fc .fc-spot{flex:1;min-width:0;font-size:16px;font-weight:700;color:var(--accent);
    text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #fc .fc-sq{flex:none;width:28px;height:28px;border-radius:5px;
    box-shadow:0 1px 3px rgba(0,0,0,.25)}
  #fc .fc-gust{flex:none;width:42px;text-align:center;font-family:var(--mono);
    font-size:20px;font-weight:800}
  #fc .fc-dircell{flex:none;display:flex;flex-direction:column;align-items:center;width:66px}
  #fc .fc-arrow{font-size:20px;line-height:1}
  #fc .fc-dir{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}

  /* שורת חלון / קשר / שעה — תמיד גלויה, מיושרת לימין */
  #fc .fc-winrow{display:flex;flex-wrap:wrap;gap:3px 12px;align-items:baseline;
    justify-content:flex-start;margin-top:8px;font-size:13px;color:var(--muted)}
  #fc .fc-winrow b{font-size:15px;color:var(--ink)}
  #fc .fc-winrow span + span::before{content:"·";margin-left:12px}

  #fc .fc-na{color:#9aa8b6}
  #fc .fc-foot{padding:8px 16px;background:#f7f9fb;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center}

  @media (max-width:640px){
    #fc .fc-spot{font-size:17px}
    #fc .fc-gust{font-size:22px}
    #fc .fc-winrow{font-size:14px}
    #fc .fc-winrow b{font-size:17px}
  }
  
  
  /* ===== מפת רוח חיה ===== */
  #wind{
    --line:#e3e9ef;--ink:#0f2436;--muted:#5b7186;--panel:#fff;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",sans-serif;
    color:var(--ink);background:#dfe7ee;border:1px solid var(--line);border-radius:14px;
    overflow:hidden;height:600px;display:flex;flex-direction:column;position:relative;
  }
  #wind *{box-sizing:border-box}
  #wind .w-head{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);
    border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
  #wind .w-title{font-size:15px;font-weight:700}
  #wind .w-sep{color:var(--line)}
  #wind .w-legend{display:flex;gap:2px;flex:1;min-width:120px}
  #wind .w-legend i{flex:1;height:12px;position:relative}
  #wind .w-legend i:first-child{border-radius:3px 0 0 3px}
  #wind .w-legend i:last-child{border-radius:0 3px 3px 0}
  #wind .w-legend span{font-family:var(--mono);font-size:9px;color:var(--muted);position:absolute;top:13px;right:-6px}
  #wind .w-refresh{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;
    font:inherit;font-size:13px;cursor:pointer}
  #wind .w-refresh:hover{background:#f1f5f9}
  #wind #w-map{flex:1;min-height:0}
  #wind .w-foot{flex:none;padding:7px 14px;background:var(--panel);border-top:1px solid var(--line);
    font-family:var(--mono);font-size:11px;color:var(--muted)}

  .wind-marker{display:flex;align-items:center;justify-content:center;position:relative}
  .wind-bubble{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:12px;color:#0f2436;border:2px solid rgba(255,255,255,.9);
    box-shadow:0 1px 4px rgba(0,0,0,.3);font-family:ui-monospace,Menlo,monospace}
  .wm-arrow{position:absolute;left:50%;top:50%;width:0;height:0;
    transform-origin:center;pointer-events:none;z-index:1}
  .wm-arrow svg{position:absolute;left:-8px;top:-33px;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
  .wind-name{position:absolute;top:36px;white-space:nowrap;font-size:10px;font-weight:600;
    color:#0f2436;text-shadow:0 0 3px #fff,0 0 3px #fff;left:50%;transform:translateX(-50%)}
  @media (max-width:640px){ #wind{height:78vh;min-height:480px} .wind-name{display:none} }

  /* ===== מפת תחנות ===== */
  #wrf{
    --bg:#f7f9fb;--panel:#fff;--ink:#0f2436;--muted:#5b7186;--line:#e3e9ef;
    --accent:#1273b8;--accent-strong:#0c5286;--accent-soft:#e7f2fb;
    --chk:#e08a1e;--chk-soft:#fbeeda;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,monospace;
    display:flex;flex-direction:column;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
    background:var(--bg);height:auto;width:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden;
    position:relative;
  }
  #wrf *{box-sizing:border-box}
  #wrf .wrf-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  #wrf .wrf-title{font-size:15px;font-weight:650;letter-spacing:-.01em}
  #wrf .wrf-sep{color:var(--line);font-weight:400}
  #wrf .wrf-count{font-family:var(--mono);font-size:12px;color:var(--muted)}
  #wrf .wrf-body{display:flex;height:440px;min-height:0;position:relative}
  #wrf .wrf-side{width:280px;flex:none;display:flex;flex-direction:column;
    background:var(--panel);border-right:1px solid var(--line)}
  #wrf .wrf-search{margin:12px;padding:9px 12px;font:inherit;font-size:14px;color:var(--ink);
    border:1px solid var(--line);border-radius:8px;background:#fff;outline:none}
  #wrf .wrf-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  #wrf .wrf-list{flex:1;overflow-y:auto;padding:0 8px 8px}
  #wrf .wrf-item{padding:8px 10px;border-radius:8px;cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:8px}
  #wrf .wrf-item:hover{background:var(--bg)}
  #wrf .wrf-item.is-sel{background:var(--accent-soft);border-left-color:var(--accent)}
  #wrf .wrf-item .dot{flex:none}
  #wrf .wrf-item-txt{min-width:0}
  #wrf .wrf-item-name{font-size:14px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #wrf .wrf-item-sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:1px}
  #wrf .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  #wrf .dot.ok{background:var(--accent)}
  #wrf .dot.chk{background:#fff;border:2px solid var(--chk)}
  #wrf .wrf-legend{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--line);
    font-size:12px;color:var(--muted)}
  #wrf .wrf-legend span{display:flex;align-items:center;gap:6px}
  #wrf .wrf-mapwrap{flex:1;min-width:0;position:relative;height:100%}
  #wrf #wrf-map{position:absolute;inset:0;height:100%;width:100%;background:#dfe7ee}
  #wrf .wrf-detail{position:relative;width:auto;max-width:100%;
    background:var(--panel);border-bottom:2px solid var(--line);
    padding:14px 18px 14px;display:flex;flex-direction:column}
  #wrf .wrf-close{position:absolute;right:8px;top:6px;border:none;background:none;font-size:20px;
    line-height:1;color:var(--muted);cursor:pointer;padding:4px}
  #wrf .wrf-d-name{font-size:15px;font-weight:650;padding-right:20px}
  #wrf .wrf-d-sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin:2px 0 10px}
  #wrf .wrf-d-chart{height:240px;flex:none}
  #wrf .wrf-d-msg{font-size:12px;color:var(--muted);line-height:1.5;margin-top:4px}

  .wg-table-scroll { overflow-x: auto; margin-top: 10px; border: 1px solid var(--line); border-radius: 6px; direction: ltr;}
  .wg-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; direction: ltr;}
  .wg-table th, .wg-table td { padding: 5px 9px; border: 1px solid #eef2f6; white-space: nowrap; }
  .wg-table th { background: #f1f5f9; color: var(--muted); font-weight: 600; }
  .wg-table td.tag { font-weight: bold; background: #fafbfc; text-align: left; }
  .wg-table td .wind-arrow { display:inline-block; font-size:15px; font-weight:bold;
    line-height:1; color:var(--accent-strong); }

  /* טבלה שנפתחת בתוך פריט ברשימה (מובייל) */
  #wrf .wrf-item-detail{ padding:0 6px 10px; }
  #wrf .wrf-item-detail .wrf-m-msg{ padding:6px 8px 10px; font-size:12px; color:var(--muted); }

  @media (max-width:640px){
    #wrf{height:82vh;min-height:520px}
    #wrf .wrf-body{flex-direction:column;min-height:0}
    /* רשימה למעלה (גוללת), מפה בחלון קבוע מתחת */
    #wrf .wrf-side{width:auto;border-right:none;flex:1 1 auto;min-height:120px;max-height:none}
    #wrf .wrf-mapwrap{flex:none;height:260px;border-top:1px solid var(--line)}
    #wrf .wrf-legend{display:flex}
    /* אין פאנל צף/מסך-מלא במובייל */
    #wrf .wrf-detail{display:none !important}
  }

  /* ===== מובייל: ביטול גלילה פנימית — כל רכיב בגובה טבעי ===== */
  @media (max-width:640px){
    /* רמזור: גובה טבעי */
    #go{ height:auto; }
    /* כרטיס תחזית: ממילא גובה טבעי — רק לוודא שאין חיתוך */
    #fc{ height:auto; }
    /* מפת תחנות: לפרוש את הרשימה והמפה במלואן, בלי גלילה פנימית */
    #wrf{ height:auto; }
    #wrf .wrf-body{ display:block; }
    #wrf .wrf-side{ max-height:none; border-bottom:1px solid var(--line); }
    #wrf .wrf-list{ max-height:60vh; }          /* הרשימה עדיין גוללת מעט אם ארוכה */
    #wrf .wrf-mapwrap{ height:320px; }          /* המפה בגובה קבוע סביר */
    /* מפת רוח חיה: גובה סביר, בלי חלון גלילה */
    #wind{ height:auto; }
    #wind #w-map{ height:360px; flex:none; }
    /* גוף הלוח: לתת לדף לגלול, לא לחתוך */
  }


  /* ===== חסימת גלילה צידית בנייד ===== */
  @media (max-width:640px){
    /* המעטפת לא חורגת מהמסך ואין גלילה אופקית ברמת העמוד */
    #dmd{ max-width:100%; overflow-x:hidden; }
    #dmd .dmd-block{ max-width:100%; overflow-x:hidden; }

    /* אף רכיב לא רחב מהמסך (מבטל max-width קבועים כמו 440/760) */
    #go, #fc, #wrf, #wind{ max-width:100% !important; width:100%; }

    /* הטבלה הרחבה של הרוח: גלילה רק בתוך התיבה שלה, לא בעמוד */
    #wrf .wg-table-scroll{ max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    #wrf .wg-table{ min-width:0; }

    /* המפות לא חורגות לרוחב */
    #wrf .wrf-mapwrap, #wrf #wrf-map, #wind #w-map{ max-width:100%; }

    /* כרטיס התחזית: לוודא שהרשת לא דוחפת רוחב */
    #fc .fc-grid{ max-width:100%; }
  }


  /* ===== חסימת גלילה צידית (בלי לשבור את Leaflet) ===== */
  html, body{ overflow-x:hidden !important; max-width:100%; }
  #dmd{ overflow-x:hidden; max-width:100%; }
  #dmd > .dmd-block{ max-width:100%; }
  /* חשוב: להחריג את Leaflet — אחרת אריחי מפה וסמנים (wind-bubble) נשברים */
  #dmd .leaflet-container img,
  #dmd .leaflet-tile,
  #dmd .leaflet-marker-icon,
  #dmd .leaflet-marker-pane *,
  #dmd .leaflet-popup-pane *{ max-width:none !important; }

const MS_TO_KT = 1.943844;
function msToKts(v) {
  return (v == null || isNaN(v)) ? null : v * MS_TO_KT;
}

function imsLocalTime(dt) {
  if (!dt) return "";
  let hm = dt.substr(11, 5);
  if (dt.indexOf("+03:00") !== -1) {
    const hh = (parseInt(hm.substr(0, 2), 10) + 1) % 24;
    hm = (hh < 10 ? "0" + hh : String(hh)) + hm.substr(2);

  return hm;
}

      for (let i = 1; i < lines.length; i++) {
        const c = lines[i].split(",");
        const g = parseFloat(c[3]);           // עמודה 4 = Gusts

  // גאסט מקסימלי בקובץ ה-WRF של תחנת חוף, מוגבל להיום ולחלון שעות נתון [fromH, toH)
  function fetchCoastGustWindow(fname, fromH, toH) {
    const url = APPS_SCRIPT_URL + "?name=" + encodeURIComponent(fname);
    return fetch(url).then(r => r.text()).then(txt => {
      if (!txt || txt.startsWith("Error")) return null;
      const lines = txt.trim().split(/\r?\n/);
      const d = new Date();
      const today =
        d.toLocaleDateString("he-IL", { timeZone:"Asia/Jerusalem", month:"2-digit" }) +

      let max = -Infinity, at = "";
      for (let i = 1; i < lines.length; i++) {

        const key = c[0] || "";
        if (!key.startsWith(today)) continue;
        const hh = parseInt(key.split("-")[1], 10) / 100 | 0; // "HHMM" -> HH

        const g = parseFloat(c[3]);

      return isFinite(max) ? { max, at } : null;

  const ICON = { pass: ["pass","✓"], fail: ["fail","✕"], warn: ["warn","!"], unk: ["unk","?"] };

  function fetchWind(ids) {

  // בסיס להשוואת "האם היום חם באופן חריג" לצורך אינדיקטור חום אזורי
  function fetchRecentZemahAvg(days) {
    const fmtIL = d => d.toLocaleDateString("en-CA", { timeZone: "Asia/Jerusalem" }); // YYYY-MM-DD
    const now = new Date();

      return vals.length ? vals.reduce((a,b)=>a+b,0) / vals.length : null;

  const QUAD = fitQuad(CFG.ronen);
  function fitQuad(pts) {
    let n = pts.length, Sx=0,Sx2=0,Sx3=0,Sx4=0,Sy=0,Sxy=0,Sx2y=0;
    pts.forEach(([x,y]) => { const x2=x*x;
      Sx+=x; Sx2+=x2; Sx3+=x2*x; Sx4+=x2*x2; Sy+=y; Sxy+=x*y; Sx2y+=x2*y; });
    return solve3([[Sx4,Sx3,Sx2,Sx2y],[Sx3,Sx2,Sx,Sxy],[Sx2,Sx,n,Sy]]);

  function solve3(M) {
    for (let i=0;i<3;i++){

      for (let k=i;k<4;k++) M[i][k]/=pv;
      for (let r=0;r<3;r++) if (r!==i){ const f=M[r][i]; for (let k=i;k<4;k++) M[r][k]-=f*M[i][k]; }

        ? { state:"pass", title:"סיכוי לגלישה", val:"סיכוי לשעתיים גלישה ~" + Math.round(prob) + "%" }
        : { state:"unk", title:"סיכוי לגלישה", val: pending ? "ממתין למדידת 10:30" : "ממתין לנתוני טמפרטורה" };

// --- אינדיקטורים חיים (IMS) ---
      const kts = (v) => msToKts(v); // המרת IMS מ-m/s לקשרים
      var extra = [];

      // מרום גולן — רמז בוקר (גאסט ≥ 14 קשר)
      if (mgAvgData && mgAvgData.ok) {
		  var mgAvg = msToKts(mgAvgData.avg);
		  var mgTime = imsLocalTime(mgAvgData.last);

		  extra.push({
			state: mgAvg >= 14 ? "pass" : "warn",
			title: "מרום גולן (רמז בוקר)",
			val: Math.round(mgAvg) + " קשר · ≥14 = מבטיח · " + mgTime
		  });
		} else {
		  extra.push({
			state: "unk",
			title: "מרום גולן (רמז בוקר)",
			val: "אין נתון"
		  });
		}


      // בית ציידה — פרוקסי דיימונד (רק אם יש נתון תקין)
      var bz = liveWind && liveWind["6"] ? liveWind["6"] : null;
      var bzG = bz ? kts(bz.gust != null ? bz.gust : bz.ws) : null;
      if (bzG != null) {
        extra.push({
          state: bzG >= 17.5 ? "pass" : "warn",
          title: "בית ציידה (דיימונד)",
          val: Math.round(bzG) + " קשר · ≥17.5 = רוח" + (bz.time ? " · " + imsLocalTime(bz.time) : "")
        });
      }

      // ציור השורות
      const rows = [c1, c1b, c2, c3, c3b, c4].concat(extra);
      $("go-checks").innerHTML = rows.map(r => {
        const [cls, ch] = ICON[r.state] || ICON.unk;
        return '<div class="go-check"><span class="go-ic ' + cls + '">' + ch + '</span>' +
          '<span class="go-ctext"><span class="go-ctitle">' + r.title + '</span>' +
          '<span class="go-cval">' + r.val + '</span></span></div>';
      }).join("");
	  
// --- הכרעה ---
      // c3 (הפרש טמפ') כבר לא שער חוסם — רק משפיע על אחוז הסיכוי (כמו c1b וחום אזורי)
      const decisionChecks = c1Relevant ? [c1, c2] : [c2];
      const known = decisionChecks.every(c => c.state !== "unk");
      const goodAll = decisionChecks.every(c => c.state === "pass");
      if (pending) {
        setLight("is-wait", "ממתין ל-10:30", "מדידת הטמפרטורות תתעדכן ~10:45");
      } else if (!known) {
        setLight("is-no", "לא ניתן לקבוע", "חלק מהנתונים לא נטענו");
      } else if (goodAll) {
        setLight("is-go", "סע לגלוש 🏄",
          prob != null ? ("סיכוי לשעתיים ~" + Math.round(prob) + "%") : "כל התנאים מתקיימים");
      } else {
        const missing = [];
        if (c1Relevant && c1.state !== "pass") missing.push("רוח");
        if (c2.state !== "pass") missing.push("גאסטים");
        setLight("is-no", "לא לגלוש", "חסר: " + missing.join(", "));
      }

      const now = new Date();
      $("go-time").textContent = "עודכן " + now.toLocaleTimeString("he-IL", {hour:"2-digit", minute:"2-digit"});
      $("go-refresh").disabled = false;
    });
  }

  $("go-refresh").addEventListener("click", run);
  run();
}

function initForecast() {

  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAM44xZxQn7Nq6E5c9kGsrorxTUWQCDWsT9Z544JF4vhx7mNw7HmLRdYaegbbfU059/exec";
  const PREFIX = "18z_1km_";
  const WINDOW_KTS = 18;   // סף לחלון רוח

  const SPOTS = [
    { f:"Kineret_Diamond", name:"דיימונד" },
    { f:"Betzet",          name:"בֶּצֶת" },
    { f:"Kiryat_Yam",      name:"קרית ים" },
    { f:"Nahsholim_Club",  name:"נחשולים" },
    { f:"Beit_Yanai",      name:"בית ינאי" }
  ];

  // סקאלת windguru (קשרים -> צבע)
  const SCALE = [[0,"#e9f2f7"],[5,"#c9e6f0"],[8,"#8fd9c8"],[11,"#67d76b"],
    [14,"#b6e34a"],[17,"#f2e13d"],[20,"#f2a93d"],[24,"#ec5e3a"],[28,"#d93030"],[34,"#a02694"]];
  const colorFor = (k) => { if (k==null) return "#cbd5e1"; let c=SCALE[0][1];
    for (const [t,col] of SCALE) if (k>=t) c=col; return c; };
  const compass = (d) => ["צפונית","צ-מזרחית","מזרחית","ד-מזרחית","דרומית","ד-מערבית","מערבית","צ-מערבית"][Math.round(((d%360)/45))%8];

  const $ = (id) => document.getElementById(id);

  function analyze(rows, cols) {
	  const gcol = cols[3] || cols[1];
	  const dcol = cols[2];
	  let maxG = -Infinity, maxAt = "", dirAtMax = null;
	  let run = 0, bestRun = 0, startAt = null, bestStart = null;
	  const stepH = 0.5;

	  rows.forEach(r => {
		const g = parseFloat(r[gcol]);
		if (!isNaN(g)) {
		  if (g > maxG) { maxG = g; at = r[cols[0]]; dirAtMax = dcol ? parseFloat(r[dcol]) : null; }
		  if (g >= WINDOW_KTS) {
			if (run === 0) startAt = r[cols[0]]; // תחילת רצף חדש
			run += stepH;
			if (run > bestRun) { bestRun = run; bestStart = startAt; }
		  } else {
			run = 0;
			startAt = null;
		  }
		}
	  });

	  return { gust: isFinite(maxG) ? maxG : null, window: bestRun, dir: dirAtMax, start: bestStart };
	}


  function load(fname) {
	  return new Promise((res) => {
		fetch(APPS_SCRIPT_URL + "?name=" + encodeURIComponent(fname))
		  .then(r => r.text())
		  .then(txt => {
			if (!txt || txt.startsWith("Error")) return res(null);

			const p = Papa.parse(txt, { header:true, skipEmptyLines:true });
			const rows = p.data, cols = p.meta.fields || [];
			if (!rows.length || !cols.length) return res(null);

			// ⭐ תאריך בפורמט MMDD לפי שעון ישראל
			const d = new Date();
			const today =
			  d.toLocaleDateString("he-IL", { timeZone:"Asia/Jerusalem", month:"2-digit" }) +
			  d.toLocaleDateString("he-IL", { timeZone:"Asia/Jerusalem", day:"2-digit" });

			// ⭐ סינון נתוני היום בלבד
			const rowsToday = rows.filter(r => r[cols[0]].startsWith(today));

			if (!rowsToday.length) return res(null);

			res(analyze(rowsToday, cols));
		  })
		  .catch(() => res(null));
	  });
	}




  function render(results) {
	  $("fc-grid").innerHTML = SPOTS.map((s, i) => {
		const d = results[i];
		const g = d && d.gust != null ? Math.round(d.gust) : null;
		const win = d ? d.window : 0;
		const dir = d && d.dir != null && !isNaN(d.dir) ? d.dir : null;
		const start = d && d.start ? d.start.split("-")[1].replace(/(\d{2})(\d{2})/, "$1:$2") : null;
		const arrowHtml = dir != null
		  ? '<span class="fc-arrow" style="transform:rotate('+((dir+180)%360)+'deg)">↑</span>'
		  : '<span class="fc-arrow fc-na">–</span>';
		const dirTxt = dir != null ? Math.round(dir)+'° '+compass(dir) : '';
		return '<div class="fc-col">' +
		  '<div class="fc-row">' +
			'<div class="fc-spot">'+s.name+'</div>' +
			'<div class="fc-sq" style="background:'+colorFor(g)+'"></div>' +
			'<div class="fc-gust'+(g==null?' fc-na':'')+'">'+(g!=null?g:'–')+'</div>' +
			'<div class="fc-dircell">'+arrowHtml+'<span class="fc-dir">'+dirTxt+'</span></div>' +
		  '</div>' +
		  '<div class="fc-winrow">' +
			'<span>חלון: <b>'+(win>0?win:'0')+'</b> ש׳</span>' +
			'<span>מעל '+WINDOW_KTS+' קשר</span>' +
			(start ? '<span>משעה '+start+'</span>' : '') +
		  '</div>' +
		'</div>';
	  }).join("");
	}


  function run() {
    $("fc-foot").textContent = "טוען…";
    $("fc-refresh").disabled = true;
    Promise.all(SPOTS.map(s => load(PREFIX + s.f + ".csv"))).then(results => {
      render(results);
      const ok = results.filter(Boolean).length;
      $("fc-date").textContent = new Date().toLocaleDateString("he-IL", {weekday:"long", day:"numeric", month:"long"});
      $("fc-foot").textContent = "מקור: WRF-1km · " + ok + "/" + SPOTS.length + " ספוטים נטענו · חלון = רצף שעות מעל " + WINDOW_KTS + " קשר";
      $("fc-refresh").disabled = false;
    });
  }

  $("fc-refresh").addEventListener("click", run);
  run();
}

      .finally(() => { $("w-refresh").disabled = false; });

}

    row.querySelector(".dot").classList.add(isChk ? "chk" : "ok");
    row.querySelector(".wrf-item-name").textContent = s.name;
    const files = [s.model && "forecast", s.obs && "observed"].filter(Boolean).join(" + ");
    row.querySelector(".wrf-item-sub").textContent = s.lat.toFixed(3)+", "+s.lon.toFixed(3)+"  ·  "+files;
    row.addEventListener("click", () => select(s, true));
    const det = document.createElement("div");
    det.className = "wrf-item-detail";
    det.style.display = "none";
    wrap.appendChild(row); wrap.appendChild(det);
    s.row = row; s.wrap = wrap; s.detailEl = det;
    listEl.appendChild(wrap);
  });

  map.fitBounds(L.latLngBounds(STATIONS.map(s => [s.lat, s.lon])).pad(0.15));

  setTimeout(() => { map.invalidateSize(); }, 300);

  const isMobile = () => window.matchMedia("(max-width: 640px)").matches;

  function select(s, fromList) {
    if (isMobile()) { toggleMobileDetail(s, fromList); return; }
    // --- דסקטופ: פאנל צדדי עם גרף + טבלה ---
    if (selected && selected.row) selected.row.classList.remove("is-sel");
    selected = s;
    if (s.row) {
      s.row.classList.add("is-sel");
      if (fromList !== true) s.row.scrollIntoView({block:"nearest", behavior:"smooth"});
    }
    map.flyTo([s.lat, s.lon], Math.max(map.getZoom(), 10), {duration:.5});
    openDetail(s);
  }

  // --- מובייל: לחיצה על תחנה פותחת טבלה מתחת לשם (ללא גרף) ---
  let mobileOpen = null;
  function toggleMobileDetail(s, fromList) {
    if (mobileOpen === s) {
      s.detailEl.style.display = "none";
      s.row.classList.remove("is-sel");
      mobileOpen = null;
      return;
    }
    if (mobileOpen) { mobileOpen.detailEl.style.display = "none"; mobileOpen.row.classList.remove("is-sel"); }
    mobileOpen = s;
    s.row.classList.add("is-sel");
    s.detailEl.style.display = "block";
    s.detailEl.innerHTML = '<div class="wrf-m-msg">טוען…</div>';
    if (fromList !== true) s.row.scrollIntoView({block:"nearest", behavior:"smooth"});
    map.setView([s.lat, s.lon], Math.max(map.getZoom(), 10));

    const jobs = [];
    if (s.model) jobs.push(load(PREFIX + s.f + ".csv", "Forecast"));
    if (s.obs)   jobs.push(load(PREFIX + s.f + "_wind_station.csv", "Observed"));
    if (!jobs.length) { s.detailEl.innerHTML = '<div class="wrf-m-msg">אין נתונים לתחנה זו.</div>'; return; }

    Promise.all(jobs).then((sets) => {
      if (mobileOpen !== s) return;               // המשתמש עבר לתחנה אחרת
      const ok = sets.filter(Boolean);
      if (!ok.length) { s.detailEl.innerHTML = '<div class="wrf-m-msg">לא הצלחתי לקרוא את הנתונים.</div>'; return; }
      s.detailEl.innerHTML = buildWindguruTableHTML(ok[0]);
    });
  }

  function openDetail(s) {
    $("wrf-detail").style.display = "flex";
    $("wrf-d-name").textContent = s.name;
    $("wrf-d-sub").textContent = s.lat.toFixed(4)+", "+s.lon.toFixed(4)
      + (s.conf === "chk" ? "  ·  location estimated" : "");
    $("wrf-d-msg").textContent = "";
    $("wrf-d-table-wrap").innerHTML = "";
    if (chart) { chart.destroy(); chart = null; }

    const jobs = [];
    if (s.model) jobs.push(load(PREFIX + s.f + ".csv", "Forecast"));
    if (s.obs)   jobs.push(load(PREFIX + s.f + "_wind_station.csv", "Observed"));

    if (!jobs.length) {
      $("wrf-d-msg").textContent = "No data files configured for this station.";
      return;
    }

    $("wrf-d-msg").textContent = "Loading…";
    Promise.all(jobs).then((sets) => {
      const ok = sets.filter(Boolean);
      if (!ok.length) { $("wrf-d-msg").textContent = "Couldn't read the data files for this station."; return; }
      $("wrf-d-msg").textContent = "";
      drawChart(ok);
      drawWindguruTable(ok[0]);
    });
  }

  function load(fname, tag) {
	  return new Promise((res) => {
		const requestUrl = APPS_SCRIPT_URL + "?name=" + encodeURIComponent(fname);

		fetch(requestUrl)
		  .then(response => {
			if (!response.ok) throw new Error("HTTP error " + response.status);
			return response.text();
		  })
		  .then(csvText => {
			if (csvText.startsWith("Error")) return res(null);

			Papa.parse(csvText, {
			  header: true,
			  skipEmptyLines: true,
			  complete: (r) => {
				const rows = r.data, cols = r.meta.fields || [];
				if (!rows.length || !cols.length) return res(null);

				// ⭐ זמן נוכחי לפי שעון ישראל
				const nowIL = new Date().toLocaleString("en-GB", {
				  timeZone: "Asia/Jerusalem",
				  hour12: false
				});

				const [datePart, timePart] = nowIL.split(", ");
				const [day, month] = datePart.split("/");   // DD/MM/YYYY → DD/MM
				const [hour, minute] = timePart.split(":");

				const todayMMDD = month + day;              // 0805
				const nowHHMM   = hour + minute;            // 2137
				const nowKey    = todayMMDD + "-" + nowHHMM;

				// ⭐ סינון נתונים עתידיים בלבד
				const futureRows = rows.filter(r => r[cols[0]] > nowKey);

				if (!futureRows.length) return res(null);

				// המשך כמו קודם — בניית מערכים לגרף/טבלה
				const xkey    = cols[0];
				const windCol = cols[1];
				const dirCol  = cols[2] || null;
				const gustCol = cols[3] || null;

				const numCol = (c) => c ? futureRows.map(v => parseFloat(v[c])) : null;
				const hasNums = (arr) => arr && arr.some(n => !isNaN(n));

				res({
				  tag,
				  labels: futureRows.map(v => v[xkey]),
				  speed: numCol(windCol),
				  gust: hasNums(numCol(gustCol)) ? numCol(gustCol) : null,
				  dir:  hasNums(numCol(dirCol))  ? numCol(dirCol)  : null
				});
			  }
			});
		  })
		  .catch(() => res(null));
	  });
	}


  function drawChart(sets) {
    const colors = { Forecast:"#1273b8", Observed:"#e0552e" };
    const labels = sets[0].labels;
    const ds = sets.map((s) => ({
      label: s.tag + (s.gust ? " (Gusts)" : " (Wind)"),
      data: s.gust || s.speed,
      borderColor: colors[s.tag] || "#5b7186",
      backgroundColor: "transparent",
      borderWidth: 2,
      pointRadius: 3,
      pointHoverRadius: 5,
      tension: .25
    }));

    chart = new Chart($("wrf-canvas"), {
      type: "line",
      data: { labels, datasets: ds },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { labels: { boxWidth: 10, font: { size: 11 } } }
        },
        scales: {
          x: { ticks: { maxTicksLimit: 6, font: { size: 10 } }, grid: { display: false } },
          y: { ticks: { font: { size: 10 } }, grid: { color: "#eef2f6" } }
        }
      }
    });
  }

  function drawWindguruTable(set) {
    if (!set) return;
    $("wrf-d-table-wrap").innerHTML = buildWindguruTableHTML(set);
  }

  function buildWindguruTableHTML(set) {
    if (!set) return "";

    // חץ שעף עם הרוח (Windguru): dir = מהיכן הרוח באה, ולכן +180.
    const arrowCell = (d) => {
      if (d == null || isNaN(d)) return '<td>-</td>';
      const rot = ((ARROW_POINTS_DOWNWIND ? d + 180 : d) % 360 + 360) % 360;
      return '<td><span class="wind-arrow" style="transform:rotate(' + rot + 'deg);" title="'
        + Math.round(d) + '°">↑</span></td>';
    };

    let html = '<div class="wg-table-scroll"><table class="wg-table"><thead><tr><th>Time</th>';
    set.labels.forEach(l => { html += '<th>' + l + '</th>'; });
    html += '</tr></thead><tbody>';

    // Wind
    html += '<tr><td class="tag">Wind (kts)</td>';
    set.speed.forEach(s => { html += '<td>' + (isNaN(s) ? '-' : Math.round(s)) + '</td>'; });
    html += '</tr>';

    // Dir — חצים, ישר מתחת ל-Wind
    html += '<tr><td class="tag">Dir</td>';
    if (set.dir) { set.dir.forEach(d => { html += arrowCell(d); }); }
    else { set.speed.forEach(() => { html += '<td>-</td>'; }); }
    html += '</tr>';

    // Gusts
    if (set.gust) {
      html += '<tr><td class="tag">Gusts (kts)</td>';
      set.gust.forEach(g => { html += '<td>' + (isNaN(g) ? '-' : Math.round(g)) + '</td>'; });
      html += '</tr>';
    }

    html += '</tbody></table></div>';
    return html;
  }

  $("wrf-close").addEventListener("click", () => {
    $("wrf-detail").style.display = "none";
    if (selected && selected.row) selected.row.classList.remove("is-sel");
    selected = null;
  });

  var mapToggleBtn = document.getElementById("wrf-map-toggle");
  if (mapToggleBtn) mapToggleBtn.addEventListener("click", function () {
    var on = document.getElementById("wrf").classList.toggle("show-map");
    mapToggleBtn.textContent = on ? "🗺️ הסתר מפה" : "🗺️ הצג מפה";
    if (on) setTimeout(function () {
      map.invalidateSize();
      map.fitBounds(L.latLngBounds(STATIONS.map(function (s) { return [s.lat, s.lon]; })).pad(0.15));
    }, 80);
  });

  $("wrf-search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    let shown = 0;
    STATIONS.forEach((s) => {
      const hit = !q || s.name.toLowerCase().includes(q);
      s.wrap.style.display = hit ? "" : "none";
      const on = map.hasLayer(s.marker);
      if (hit && !on) s.marker.addTo(map);
      if (!hit && on) map.removeLayer(s.marker);
      if (hit) shown++;
    });
    countEl.textContent = shown + " of " + STATIONS.length + " stations";
  });

  countEl.textContent = STATIONS.length + " stations";
}

// ===== אתחול כל הרכיבים (כולם גלויים, אחד מתחת לשני) =====
(function () {
  [initGo, initForecast, initLive, initStations].forEach(function (fn) {
    try { fn(); } catch (e) { console.error(e); }
  });
  // תיקון גודל מפות אחרי הרינדור
  setTimeout(() => window.dispatchEvent(new Event('resize')), 200);
})();
</script>
